<script>
document.addEventListener('DOMContentLoaded', function() {
  // Remove code tools button completely
  const codeButton = document.querySelector('.code-tools-button');
  if (codeButton) {
    codeButton.remove();
  }

  // Smooth scrolling for in-page anchor links (skip listing category elements)
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    if (anchor.closest('.quarto-listing-category')) return;
    anchor.addEventListener('click', function (e) {
      const target = document.querySelector(this.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth' });
    });
  });
});
</script>
