freeze: auto
toc: true
# Draft callout at the top of each post; opt out per post with
# `draft-note: false`.
filters:
  - ../_includes/draft-note.lua
format:
  html:
    code-fold: false
    code-tools: false
  pdf:
    pdf-engine: xelatex
    monofont: 'DejaVu Sans Mono'
    geometry: margin=1in
    fontsize: 11pt
    toc: false
